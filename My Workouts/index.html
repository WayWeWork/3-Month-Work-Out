<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "SF Pro Display", system-ui, sans-serif;
      background: #000;
      color: #fff;
    }

    .app {
      max-width: 420px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }

    button {
      background: #111;
      color: #fff;
      border: 1px solid #333;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
    }

    .card {
      background: #0a0a0a;
      border-radius: 22px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #222;
    }

    .exercise {
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name {
      flex: 1;
      font-size: 14px;
      color: #ddd;
    }

    .info {
      width: 24px;
      height: 24px;
      background: #0a84ff;
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 12px;
    }

    input {
      width: 70px;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      padding: 4px;
    }

    textarea {
      width: 100%;
      margin-top: 4px;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      padding: 6px;
      font-size: 12px;
    }

    .suggest {
      font-size: 11px;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>Training</h1>

    <div class="controls">
      <button onclick="prevWeek()">◀</button>
      <span id="weekLabel">Week 1</span>
      <button onclick="nextWeek()">▶</button>
    </div>

    <div id="workout"></div>
  </div>

  <script>
    const data =
      JSON.parse(localStorage.getItem("training-data")) || {};

    let week = 1;

    const workouts = {
      A: [
        ["Barbell Hip Thrust", "https://www.exrx.net/WeightExercises/GluteusMaximus/BBHipThrust"],
        ["Goblet Squat", "https://www.exrx.net/WeightExercises/Quadriceps/DBGobletSquat"],
        ["Romanian Deadlift", "https://www.stronglifts.com/romanian-deadlift/"],
        ["Step-Ups", "https://www.exrx.net/WeightExercises/Quadriceps/DBStepUp"],
        ["Back Extension", "https://www.exrx.net/WeightExercises/ErectorSpinae/BWHyperextension"],
        ["Plank", "https://www.exrx.net/WeightExercises/RectusAbdominis/BWPlank"],
      ],
      B: [
        ["Bench Press", "https://stronglifts.com/bench-press/"],
        ["Seated Cable Row", "https://www.exrx.net/WeightExercises/BackGeneral/CBSeatedRow"],
        ["Bulgarian Split Squat", "https://www.exrx.net/WeightExercises/Quadriceps/DBBulgarianSplitSquat"],
        ["Single-Leg Glute Bridge", "https://www.youtube.com/watch?v=5Xt7uLQjG0I"],
        ["Pallof Press", "https://www.exrx.net/WeightExercises/Obliques/CBPallofPress"],
        ["Farmers Carry", "https://www.youtube.com/watch?v=Fkzk_RqlYig"],
      ],
      C: [
        ["Trap Bar Deadlift", "https://www.youtube.com/watch?v=1jto6MWWRwY"],
        ["Lat Pulldown", "https://www.exrx.net/WeightExercises/LatissimusDorsi/CBFrontLatPulldown"],
        ["Walking Lunges", "https://www.exrx.net/WeightExercises/Quadriceps/DBWalkingLunge"],
        ["Cable Pull-Through", "https://www.exrx.net/WeightExercises/GluteusMaximus/CBPullThrough"],
        ["DB Shoulder Press", "https://www.exrx.net/WeightExercises/DeltoidAnterior/DBShoulderPress"],
        ["Dead Bug", "https://www.youtube.com/watch?v=8s8JH6FUk0g"],
      ],
    };

    function render() {
      document.getElementById("weekLabel").innerText = "Week " + week;
      const workoutKey = ["A", "B", "C"][(week - 1) % 3];
      const container = document.getElementById("workout");
      container.innerHTML = "";

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<strong>Workout ${workoutKey}</strong>`;

      workouts[workoutKey].forEach(([name, link]) => {
        const ex = document.createElement("div");
        ex.className = "exercise";

        const wVal = data[week]?.[name]?.weight || "";
        const nVal = data[week]?.[name]?.notes || "";

        ex.innerHTML = `
          <div class="row">
            <div class="name">${name}</div>
            ${link}i</a>
            <input type="number" value="${wVal}" placeholder="kg"
              onchange="save('${name}', this.value, '${nVal}')"/>
          </div>
          <div class="suggest">${wVal ? "Next week: " + (Number(wVal) + 2.5) + " kg" : ""}</div>
          <textarea placeholder="Notes"
            oninput="save('${name}', '${wVal}', this.value)">${nVal}</textarea>
        `;

        card.appendChild(ex);
      });

      container.appendChild(card);
    }

    function save(name, weight, notes) {
      data[week] = data[week] || {};
      data[week][name] = { weight, notes };
      localStorage.setItem("training-data", JSON.stringify(data));
      render();
    }

    function nextWeek() {
      if (week < 12) week++;
      render();
    }

    function prevWeek() {
      if (week > 1) week--;
      render();
    }

    render();
  </script>
</body>
</html>
